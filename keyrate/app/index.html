<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyrate</title>
<meta name="description" content="A typing test. Type the words, see your speed.">
<link rel="icon" href="../icon.svg">
<link rel="stylesheet" href="https://jaybulb.com/tokens.css">
<style>
/* white paper, not the shared cream (Joshua 2026-11-01); dark mode keeps the shared tokens */
@media (prefers-color-scheme: light) { :root { --color-bg: #fff; --color-bg2: #f5f5f7; --color-hairline: #e5e5ea; } }
  :root { --ok: var(--text, #111); --bad: #c0392b; --dim: #666; --word: #888; }
  /* upcoming words are large text (3:1 needed), labels and hints are small text (4.5:1 needed) */
  @supports (color: color-mix(in srgb, red 50%, blue)) {
    :root { --dim: color-mix(in srgb, var(--text, #111) 66%, transparent); --word: color-mix(in srgb, var(--text, #111) 52%, transparent); }
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bad: #e0614f; } }
  :root[data-theme="dark"] { --bad: #e0614f; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg, #fafafa); color: var(--text, #111);
    font-family: var(--font-body, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem; box-sizing: border-box;
  }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 2.5rem; max-width: 100%; }
  h1 { font-size: 1rem; font-weight: 600; letter-spacing: .02em; margin: 0; color: var(--dim); }
  nav {
    position: sticky; top: .75rem; z-index: 2; padding: .3rem; border-radius: var(--radius-pill, 999px);
    background: rgba(255,255,255,.26); backdrop-filter: blur(30px) saturate(190%) brightness(1.3); -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 4px 16px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) { nav { background: rgba(28,28,30,.34); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 4px 16px rgba(0,0,0,.3); } }
  @media (prefers-reduced-transparency: reduce) { nav { background: #f2f2f7; backdrop-filter: none; -webkit-backdrop-filter: none; } }
  @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: dark) { nav { background: #1c1c1e; } }
  nav { display: flex; gap: .25rem; flex-wrap: wrap; justify-content: center; }
  nav button {
    all: unset; cursor: pointer; padding: .3rem .7rem; border-radius: var(--radius-pill, 999px);
    color: var(--dim); font-size: .9rem;
  }
  nav button[aria-pressed="true"] { color: var(--text, #111); background: var(--bg2, #eee); }
  nav button:focus-visible { outline: 2px solid var(--text, #111); outline-offset: 2px; }
  nav span { color: var(--border, #ddd); padding: .3rem .2rem; }
  #words {
    max-width: 52rem; font-size: 1.75rem; line-height: 1.6; height: calc(1.6em * 3); overflow: hidden;
    display: flex; flex-wrap: wrap; gap: 0 .55em; position: relative; cursor: text;
    transition: opacity .2s;
  }
  #words.blur { opacity: .35; filter: blur(3px); }
  .w { white-space: nowrap; color: var(--word); }
  .w.err { text-decoration: underline; text-decoration-color: var(--bad); }
  .w .ok { color: var(--ok); } .w .bad { color: var(--bad); } .w .extra { color: var(--bad); opacity: .6; }
  #caret {
    position: absolute; width: 2px; height: 1.3em; background: var(--accent, #111); border-radius: 1px;
    transition: left .07s, top .07s; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #live { font-size: 1.1rem; color: var(--dim); min-height: 1.5em; }
  #hint { color: var(--dim); font-size: .85rem; margin: 0; text-align: center; }
  kbd { font: inherit; border: 1px solid var(--border, #ddd); border-radius: 4px; padding: 0 .35em; }
  #result { display: none; text-align: center; }
  #result.show { display: block; }
  #result .big { font-size: 4rem; font-weight: 600; line-height: 1; }
  #result .big small { font-size: 1rem; font-weight: 400; color: var(--dim); margin-left: .5rem; }
  #result dl { display: flex; gap: 2rem; justify-content: center; margin: 1.5rem 0 0; }
  #result dt { color: var(--dim); font-size: .8rem; } #result dd { margin: 0; font-size: 1.3rem; }
  #best { color: var(--dim); font-size: .9rem; margin-top: 1rem; }
  #curve { margin-top: 1rem; } #curve polyline { fill: none; stroke: var(--accent, #111); stroke-width: 2; }
  #hist { margin-top: .75rem; }
  #hist polyline { fill: none; stroke: var(--accent, #111); stroke-width: 1.5; }
  input#sink { position: absolute; opacity: 0; pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) { #caret { animation: none; transition: none; } #words { transition: none; } }
  @media (max-width: 600px) { #words { font-size: 1.3rem; } #result .big { font-size: 3rem; } }
</style>
</head>
<body>
<main id="stage">
  <h1>Keyrate</h1>
  <nav id="modes" aria-label="Test mode">
    <button data-mode="time" data-n="15">15</button>
    <button data-mode="time" data-n="30">30</button>
    <button data-mode="time" data-n="60" aria-pressed="true">60</button>
    <span aria-hidden="true">|</span>
    <button data-mode="words" data-n="25">25 words</button>
    <button data-mode="words" data-n="50">50 words</button>
    <button data-mode="quote" data-n="1">quote</button>
    <span aria-hidden="true">|</span>
    <button id="punct" aria-pressed="false" title="Punctuation and numbers">punct</button>
    <button id="restart">restart</button>
  </nav>
  <div id="live" aria-hidden="true">&nbsp;</div>
  <div id="words" aria-hidden="true"><span id="caret"></span></div>
  <p id="hint"></p>
  <div id="result">
    <div class="big"><span id="rWpm"></span><small>wpm</small></div>
    <dl><div><dt>accuracy</dt><dd id="rAcc"></dd></div><div><dt>keys</dt><dd id="rKeys"></dd></div><div><dt>raw</dt><dd id="rRaw"></dd></div><div><dt>chars</dt><dd id="rChars"></dd></div></dl>
    <svg id="curve" width="320" height="64" role="img" aria-label="Words per minute over the run" hidden></svg>
    <div id="best"></div>
    <svg id="hist" width="240" height="40" role="img" aria-label="Recent runs" hidden></svg>
  </div>
<!-- inside main so every part of the page sits in a landmark; both are absolutely placed, so the layout is unchanged -->
<input id="sink" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the words shown" aria-describedby="srWords hint">
<p id="srWords" class="sr"></p>
<p id="srResult" class="sr" role="status"></p>
</main>

<script type="module">
import { Session } from '../session.js'
import { stats } from '../score.js'
import { WORDS, QUOTES } from '../words.js'

const $ = s => document.querySelector(s)
const wordsEl = $('#words'), caret = $('#caret'), live = $('#live'), sink = $('#sink'), result = $('#result'), hint = $('#hint')
const HINT = 'Start typing. <kbd>Tab</kbd> restarts, <kbd>Esc</kbd> picks a mode.'
let t0 = 0, curve = []
let kind = 'time', n = 60, punct = false, session, timer = 0, lastQuote = null, shown = 0

// the last mode and punct setting survive a reload
try { const p = JSON.parse(localStorage.getItem('prefs')); if (p) ({ kind, n, punct } = p) } catch {}
const chip = () => [...document.querySelectorAll('#modes button[data-mode]')].find(b => b.dataset.mode === kind && +b.dataset.n === n)
if (chip()) { document.querySelectorAll('#modes button').forEach(x => x.removeAttribute('aria-pressed')); chip().setAttribute('aria-pressed', 'true') } else { kind = 'time'; n = 60 }
$('#punct').setAttribute('aria-pressed', punct)
const savePrefs = () => { try { localStorage.setItem('prefs', JSON.stringify({ kind, n, punct })) } catch {} }

function reset() {
  t0 = 0; curve = []
  clearInterval(timer); timer = 0
  session = new Session({ kind, n, punct, words: WORDS, quotes: QUOTES, avoid: lastQuote })
  if (kind === 'quote') lastQuote = session.target.join(' ')
  result.classList.remove('show'); wordsEl.classList.remove('blur')
  $('#srResult').textContent = ''; hint.innerHTML = HINT
  counter(); sink.value = ''; shown = 0; render(); sink.focus({ preventScroll: true })
}

const counter = () => { live.textContent = kind === 'time' ? session.remaining(Date.now()) : `${Math.min(session.typed.length - 1, session.total)}/${session.total}` }

function render() {
  const { target, typed } = session
  if (shown !== target.length) { $('#srWords').textContent = target.join(' '); shown = target.length }
  wordsEl.querySelectorAll('.w').forEach(e => e.remove())
  const i = typed.length - 1
  target.forEach((t, k) => {
    const w = document.createElement('span'); w.className = 'w'
    const ty = typed[k] ?? ''
    if (k < i && ty !== t) w.classList.add('err')
    for (let c = 0; c < Math.max(t.length, ty.length); c++) {
      const s = document.createElement('span')
      if (c >= t.length) { s.className = 'extra'; s.textContent = ty[c] }
      else { s.textContent = t[c]; if (c < ty.length) s.className = ty[c] === t[c] ? 'ok' : 'bad' }
      w.appendChild(s)
    }
    wordsEl.appendChild(w)
  })
  // caret + keep the active line at the top of the 3-line window
  const cur = wordsEl.children[i + 1], chars = cur.children, ci = typed[i].length
  const ref = chars[Math.min(ci, chars.length - 1)]
  const r = ref.getBoundingClientRect(), box = wordsEl.getBoundingClientRect()
  const lineH = parseFloat(getComputedStyle(wordsEl).lineHeight)
  const row = Math.round((cur.offsetTop) / lineH)
  wordsEl.scrollTop = Math.max(0, row - 1) * lineH
  caret.style.left = (ci >= chars.length ? r.right : r.left) - box.left + 'px'
  caret.style.top = cur.offsetTop - wordsEl.scrollTop + (lineH - r.height * 1.3) / 2 + 'px'
}

function tick() {
  session.tick(Date.now()); counter()
  // ponytail: one wpm sample per second for the result curve
  if (session.typed.join('').length) { t0 ||= Date.now(); const sec = Math.floor((Date.now() - t0) / 1000); if (sec > curve.length && sec) curve.push(stats(session.typed, session.target, sec).wpm) }
  if (session.done) showResult()
}

function showResult() {
  clearInterval(timer)
  const s = session.result
  $('#rWpm').textContent = s.wpm; $('#rAcc').textContent = s.accuracy + '%'; $('#rKeys').textContent = session.keyAccuracy + '%'
  $('#rRaw').textContent = s.raw; $('#rChars').textContent = `${s.correct}/${s.wrong}`
  const cv = $('#curve'), cm = Math.max(...curve, 1), cl = Math.min(...curve) * .8, cr = Math.max(cm - cl, 1)
  cv.hidden = curve.length < 3
  if (curve.length > 2) cv.innerHTML = `<polyline points="${curve.map((v, i) => `${i / (curve.length - 1) * 316 + 2},${62 - (v - cl) / cr * 60}`).join(' ')}"/>`
  const label = kind === 'time' ? n + 's' : kind === 'quote' ? 'quote' : n + ' words'
  const key = `best:${kind}:${kind === 'quote' ? 1 : n}`
  let best = 0; try { best = +localStorage.getItem(key) || 0; if (!session.pasted && s.wpm > best) localStorage.setItem(key, best = s.wpm) } catch {}
  $('#best').textContent = `best ${best} wpm · ${label}${session.pasted ? ' · pasted, not counted' : ''}`
  // ponytail: last 30 runs as a sparkline, localStorage only
  try {
    const runs = (JSON.parse(localStorage.getItem('runs')) || []).concat(s.wpm).slice(-30)
    localStorage.setItem('runs', JSON.stringify(runs))
    const hist = $('#hist'), max = Math.max(...runs, 1), W = 240, H = 40
    hist.hidden = runs.length < 2
    if (runs.length > 1) hist.innerHTML = `<polyline points="${runs.map((v, i) => `${i / (runs.length - 1) * (W - 4) + 2},${H - 2 - v / max * (H - 4)}`).join(' ')}"/>`
  } catch {}
  wordsEl.classList.add('blur'); result.classList.add('show'); live.textContent = session.elapsed
  hint.innerHTML = '<kbd>Enter</kbd> or <kbd>Tab</kbd> restarts.'
  $('#srResult').textContent = `${s.wpm} words per minute, ${s.accuracy} percent accuracy, ${session.keyAccuracy} percent of keys right, ${label}. Best ${best}.`
}

// The input holds every word typed so far; a refused edit (a finished word changed) is put back.
sink.addEventListener('input', () => {
  if (session.done) return
  session.setText(sink.value, Date.now())
  sink.value = session.text
  if (session.startMs && !timer) timer = setInterval(tick, 100)
  if (session.done) return showResult()
  if (kind !== 'time') counter()
  render()
})
// No timer while the tab is hidden. The clock is Date.now, so a timed run still ends on time when you come back.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearInterval(timer); timer = 0 }
  else if (session.startMs && !session.done && !timer) { timer = setInterval(tick, 100); tick() }
})
// Tab and Enter restart only while typing, so Tab still walks the page from the mode buttons.
document.addEventListener('keydown', e => {
  const typing = document.activeElement === sink || document.activeElement === document.body
  if (e.key === 'Escape') { e.preventDefault(); document.querySelector('#modes button[data-mode][aria-pressed="true"]')?.focus() }
  else if (typing && (e.key === 'Tab' || (session.done && e.key === 'Enter'))) { e.preventDefault(); reset() }
})
wordsEl.addEventListener('click', () => sink.focus({ preventScroll: true }))
sink.addEventListener('blur', () => { if (!session.done) wordsEl.classList.add('blur') })
sink.addEventListener('focus', () => { if (!session.done) wordsEl.classList.remove('blur') })
$('#punct').addEventListener('click', e => {
  punct = !punct; e.currentTarget.setAttribute('aria-pressed', punct); savePrefs(); reset()
})
$('#restart').addEventListener('click', reset)
$('#modes').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]'); if (!b) return
  document.querySelectorAll('#modes button').forEach(x => x.removeAttribute('aria-pressed'))
  b.setAttribute('aria-pressed', 'true'); kind = b.dataset.mode; n = +b.dataset.n; savePrefs(); reset()
})
// arrow keys walk the mode buttons; Enter or Space picks
$('#modes').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return
  const bs = [...document.querySelectorAll('#modes button')], i = bs.indexOf(document.activeElement)
  if (i < 0) return
  e.preventDefault(); bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length].focus()
})
addEventListener('resize', () => session && !session.done && render())
// embedded on the landing: tell the page how tall the test is so the frame fits it
if (parent !== window) new ResizeObserver(() => parent.postMessage({ keyrate: 'height', h: Math.ceil($('#stage').getBoundingClientRect().height) + 64 }, location.origin)).observe($('#stage'))
reset()
</script>
</body>
</html>
