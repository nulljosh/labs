<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" style="background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
<text x="380" y="30" fill="#333" font-size="16" font-weight="600" text-anchor="middle">Keyrate Architecture</text>
<text x="380" y="48" fill="#86868b" font-size="11" text-anchor="middle">one scoring rule, five places it runs, one file that keeps them equal</text>

<rect x="270" y="66" width="220" height="44" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="380" y="85" fill="#333" font-size="12" font-weight="500" text-anchor="middle">score.js</text>
<text x="380" y="100" fill="#333" font-size="10" text-anchor="middle">wpm, raw, accuracy: five characters a word</text>
<line x1="380" y1="110" x2="380" y2="134" stroke="#d1d1d6" stroke-width="1.5"/>

<rect x="250" y="134" width="260" height="52" rx="8" fill="#5B9BD5" fill-opacity=".15" stroke="#5B9BD5"/>
<text x="380" y="155" fill="#333" font-size="12" font-weight="500" text-anchor="middle">vectors.json</text>
<text x="380" y="171" fill="#333" font-size="10" text-anchor="middle">written by vectors.mjs from score.js, 30 cases</text>

<line x1="300" y1="186" x2="86" y2="246" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="340" y1="186" x2="233" y2="246" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="380" y1="186" x2="380" y2="246" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="420" y1="186" x2="527" y2="246" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="460" y1="186" x2="674" y2="246" stroke="#d1d1d6" stroke-width="1.5"/>

<rect x="16" y="246" width="140" height="92" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="86" y="266" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Web</text>
<text x="86" y="282" fill="#333" font-size="10" text-anchor="middle">app/index.html</text>
<text x="86" y="296" fill="#333" font-size="10" text-anchor="middle">session.js</text>
<text x="86" y="318" fill="#86868b" font-size="10" text-anchor="middle">vectors.test.mjs</text>

<rect x="163" y="246" width="140" height="92" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="233" y="266" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Android</text>
<text x="233" y="282" fill="#333" font-size="10" text-anchor="middle">kmp/ Compose</text>
<text x="233" y="296" fill="#333" font-size="10" text-anchor="middle">Session.kt</text>
<text x="233" y="318" fill="#86868b" font-size="10" text-anchor="middle">VectorsTest</text>

<rect x="310" y="246" width="140" height="92" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="380" y="266" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Mac, Windows, Linux</text>
<text x="380" y="282" fill="#333" font-size="10" text-anchor="middle">kmp/ Compose Desktop</text>
<text x="380" y="296" fill="#333" font-size="10" text-anchor="middle">same Session.kt</text>
<text x="380" y="318" fill="#86868b" font-size="10" text-anchor="middle">VectorsTest</text>

<rect x="457" y="246" width="140" height="92" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="527" y="266" fill="#333" font-size="12" font-weight="500" text-anchor="middle">iPhone, iPad, Mac</text>
<text x="527" y="282" fill="#333" font-size="10" text-anchor="middle">apple/ SwiftUI</text>
<text x="527" y="296" fill="#333" font-size="10" text-anchor="middle">Session.swift</text>
<text x="527" y="318" fill="#86868b" font-size="10" text-anchor="middle">VectorsTests</text>

<rect x="604" y="246" width="140" height="92" rx="8" fill="#f5f5f7" stroke="#d1d1d6"/>
<text x="674" y="266" fill="#333" font-size="12" font-weight="500" text-anchor="middle">Terminal</text>
<text x="674" y="282" fill="#333" font-size="10" text-anchor="middle">tui/ raw mode</text>
<text x="674" y="296" fill="#333" font-size="10" text-anchor="middle">symlinks Session.swift</text>
<text x="674" y="318" fill="#86868b" font-size="10" text-anchor="middle">keyrate-tui --check</text>
<path d="M597 292 H604" stroke="#5B9BD5" stroke-width="1.5" stroke-dasharray="3 3"/>

<line x1="86" y1="338" x2="86" y2="370" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="233" y1="338" x2="233" y2="370" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="380" y1="338" x2="380" y2="370" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="527" y1="338" x2="527" y2="370" stroke="#d1d1d6" stroke-width="1.5"/>
<line x1="674" y1="338" x2="674" y2="370" stroke="#d1d1d6" stroke-width="1.5"/>
<text x="86" y="386" fill="#333" font-size="10" text-anchor="middle">localStorage</text>
<text x="233" y="386" fill="#333" font-size="10" text-anchor="middle">SharedPreferences</text>
<text x="380" y="386" fill="#333" font-size="10" text-anchor="middle">java.util.prefs</text>
<text x="527" y="386" fill="#333" font-size="10" text-anchor="middle">UserDefaults</text>
<text x="674" y="386" fill="#333" font-size="10" text-anchor="middle">~/.keyrate</text>

<rect x="16" y="406" width="728" height="40" rx="8" fill="#fff" stroke="#d1d1d6"/>
<text x="380" y="423" fill="#333" font-size="11" text-anchor="middle">Bests stay on the device. No build makes a network call. A paste of more than 20 characters never sets a best.</text>
<text x="380" y="438" fill="#86868b" font-size="10" text-anchor="middle">CI on Linux runs the web and Kotlin vector checks; the Swift checks run with the Apple and terminal builds.</text>
</svg>
