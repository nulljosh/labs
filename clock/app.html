<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock</title>
<meta name="description" content="A clock, world clocks, alarms, sleep, a stopwatch and timers in one page.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preload" href="fonts/ClockDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="clock">
    <header><h1>Clock</h1><button class="link" id="standOpen">Nightstand</button></header>
    <svg class="face" viewBox="-110 -110 220 220" aria-hidden="true">
      <circle class="rim" r="106"/>
      <g id="ticks"></g>
      <line id="hh" class="hand" y2="-52" stroke-width="7"/>
      <line id="mh" class="hand" y2="-80" stroke-width="5"/>
      <line id="sh" class="sec" y1="16" y2="-90" stroke-width="2"/>
      <circle class="hub" r="5"/>
    </svg>
    <div id="digital" class="big num"></div>
    <div id="date" class="sub"></div>
    <div id="sun" class="sub"></div>
    <div id="nextAlarm" class="sub"></div>
  </section>

  <section id="world" hidden>
    <header><h1>World Clock</h1><button class="link" id="worldEdit">Edit</button></header>
    <div class="form">
      <input id="citySearch" list="cityList" placeholder="Search for a city" aria-label="Search for a city" autocomplete="off">
      <button class="primary" id="cityAdd" style="flex:0 0 auto">Add</button>
    </div>
    <datalist id="cityList"></datalist>
    <div class="group" id="zones"></div>
  </section>

  <section id="alarms" hidden>
    <header><h1>Alarms</h1><button class="link" id="alarmNew" aria-label="Add alarm">Add</button></header>
    <h2>Sleep | Wake Up</h2>
    <div class="group"><div class="row tap" id="sleepRow"></div></div>
    <h2>Other</h2>
    <div class="group" id="alarmList"></div>
    <p class="sub">Alarms ring while this page is open. Add it to your Home Screen to keep it handy.</p>
  </section>

  <section id="stopwatch" hidden>
    <header><h1>Stopwatch</h1></header>
    <div id="swDigital" class="big num" role="button" tabindex="0" aria-label="Switch to analog stopwatch">00:00.00</div>
    <svg id="swAnalog" class="face" viewBox="-110 -110 220 220" hidden role="button" tabindex="0" aria-label="Switch to digital stopwatch">
      <circle class="rim" r="106"/>
      <g id="swTicks"></g>
      <text id="swSmall" y="40" class="num">00:00.00</text>
      <line id="swHand" class="sec" y1="16" y2="-92" stroke-width="2"/>
      <circle class="hub" r="5"/>
    </svg>
    <div class="controls">
      <button id="swLap" disabled>Lap</button>
      <button class="go" id="swStart">Start</button>
    </div>
    <div class="group" id="laps"></div>
  </section>

  <section id="timer" hidden>
    <header><h1>Timers</h1></header>
    <div class="pick" aria-label="Duration">
      <select id="tmH" aria-label="Hours"></select><span>h</span>
      <select id="tmM" aria-label="Minutes"></select><span>min</span>
      <select id="tmS" aria-label="Seconds"></select><span>s</span>
    </div>
    <div class="form" style="margin-top:var(--s3)">
      <input id="tmLabel" placeholder="Label" aria-label="Timer label" maxlength="40">
      <select id="tmSound" aria-label="When timer ends"></select>
    </div>
    <div class="controls center"><button class="go" id="tmStart">Start</button></div>
    <div id="tmActiveWrap" hidden><h2>Running</h2><div class="group" id="tmActive"></div></div>
    <div id="tmRecentWrap" hidden><h2>Recents</h2><div class="group" id="tmRecent"></div></div>
  </section>
</main>

<nav aria-label="Sections">
  <button data-tab="clock">Clock</button>
  <button data-tab="world">World</button>
  <button data-tab="alarms">Alarms</button>
  <button data-tab="stopwatch">Stopwatch</button>
  <button data-tab="timer">Timers</button>
</nav>

<dialog id="alarmSheet" aria-labelledby="alarmSheetTitle">
  <form method="dialog" id="alarmForm">
    <header><button class="link" value="cancel" formnovalidate>Cancel</button><h1 id="alarmSheetTitle">Add Alarm</h1><button class="link" id="alarmSave" value="save">Save</button></header>
    <input type="time" id="aTime" class="wheel num" required aria-label="Alarm time">
    <label>Repeat</label><div class="days" id="aDays"></div>
    <label for="aLabel">Label</label><input id="aLabel" maxlength="40" placeholder="Alarm">
    <label for="aSound">Sound</label><select id="aSound"></select>
    <div class="group" style="margin-top:var(--s4)"><div class="row"><label class="grow" for="aSnooze">Snooze</label><input type="checkbox" class="switch" id="aSnooze" checked></div></div>
    <button type="button" class="danger" id="alarmDelete" style="width:100%">Delete Alarm</button>
  </form>
</dialog>

<dialog id="sleepSheet" aria-labelledby="sleepSheetTitle">
  <form method="dialog" id="sleepForm">
    <header><button class="link" value="cancel" formnovalidate>Cancel</button><h1 id="sleepSheetTitle">Sleep Schedule</h1><button class="link" value="save">Done</button></header>
    <div class="form"><div><label for="sBed">Bedtime</label><input type="time" id="sBed" required></div><div><label for="sWake">Wake Up</label><input type="time" id="sWake" required></div></div>
    <p class="sub" id="sHours"></p>
    <label>Days</label><div class="days" id="sDays"></div>
    <label for="sWind">Wind Down</label>
    <select id="sWind"><option value="0">Off</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option></select>
    <label for="sSound">Wake Up Sound</label><select id="sSound"></select>
    <div class="group" style="margin-top:var(--s4)"><div class="row"><label class="grow" for="sSnooze">Snooze</label><input type="checkbox" class="switch" id="sSnooze" checked></div></div>
  </form>
</dialog>

<div class="full" id="ringing" hidden role="alertdialog" aria-labelledby="ringWhen" aria-describedby="ringWhat">
  <div class="when num" id="ringWhen"></div>
  <div class="what" id="ringWhat"></div>
  <div class="controls">
    <button class="go" id="ringSnooze">Snooze</button>
    <button id="ringRepeat">Repeat</button>
    <button class="stop" id="ringStop">Stop</button>
  </div>
</div>

<div class="full" id="stand" hidden role="dialog" aria-label="Nightstand, tap to close">
  <div class="when num" id="standTime"></div>
  <div class="what" id="standWhat"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="core.js"></script>
<script src="world.js"></script>
<script src="alarms.js"></script>
<script src="stopwatch.js"></script>
<script src="timers.js"></script>
<script src="app.js"></script>
</body>
</html>
