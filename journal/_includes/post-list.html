<ul class="post-list">
  {% for post in site.posts %}
    {% assign y = post.date | date: "%Y" %}
    {% if y != prev_year %}<li class="post-year">{{ y }}</li>{% assign prev_year = y %}{% endif %}
    <li class="post-list-item">
      <a href="{{ post.url }}">
        <span class="home-date">{{ post.date | date: "%m-%d" }}</span>
        {{ post.title }}
        {% if post.description %}<span class="home-desc">{{ post.description }}</span>{% endif %}
      </a>
    </li>
  {% endfor %}
</ul>
