<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111; }
        .text { fill: #fff; }
        .accent { fill: #0066cc; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #fff; }
        .text { fill: #000; }
        .accent { fill: #0066cc; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" class="bg"/>

  <!-- Title text -->
  <text x="80" y="130" font-size="72" font-weight="600" font-family="system-ui, -apple-system, sans-serif" class="text">
    Article
  </text>

  <!-- Decorative line -->
  <line x1="80" y1="155" x2="280" y2="155" stroke-width="3" class="accent"/>

  <!-- Date -->
  <text x="80" y="185" font-size="16" font-family="system-ui, -apple-system, sans-serif" class="text" opacity="0.6">
    Monday, August 10
  </text>
</svg>
