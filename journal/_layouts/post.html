---
layout: default
---
<article class="post">
  <a href="/" class="back-link">back</a>
  <h1 class="post-title">{{ page.title }}</h1>
  {% include post-meta.html %}
  {{ content }}
  <nav class="post-nav">
    {% if page.previous %}<a href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {% if page.next %}<a href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>{% endif %}
  </nav>
</article>
{% include footer.html %}
