name: Quotable
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  # Localizable.xcstrings only compiles the locales the project knows about.
  knownRegions: [en, fr, zh, pa, Base]

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "202610182140"

targets:
  Quotable:
    type: application
    platform: iOS
    sources:
      - path: Quotable
      - path: ../Coda.icon
      - path: ../brand/Quip.xcassets
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes: ["*.ttf", "OFL.txt"]
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Coda   # the built app is Coda.app; target and scheme keep the old name
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable
        INFOPLIST_FILE: Quotable/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Coda
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — ITMS-90886.
        CODE_SIGN_ENTITLEMENTS: Quotable.entitlements
    dependencies:
      - target: QuotableWidget
      - target: QuotableMessages

  QuotableWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/CodaWidget.swift
      - path: Quotable/Quote.swift
      - path: Quotable/Daily.swift
      - path: Quotable/Theme.swift
      - path: Quotable/DuelActivity.swift
      - path: Quotable/Resources/quotes.json
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes: ["*.ttf"]
    info:
      path: Widget/Info-iOS.plist
      properties:
        CFBundleDisplayName: Coda
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable.widget
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic

  QuotableMessages:
    type: app-extension
    platform: iOS
    sources:
      - path: Messages/MessagesViewController.swift
      - path: Quotable/Game.swift
      - path: Quotable/SharedStore.swift
      - path: Quotable/Quote.swift
      - path: Quotable/Theme.swift
      - path: Quotable/ChallengeLink.swift
      - path: Quotable/Resources/quotes.json
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes: ["*.ttf"]
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: Coda
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable.messages
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic

schemes:
  Quotable:
    build:
      targets:
        Quotable: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
