<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Horula clock</title>
<!-- A small live clock or countdown for any page, as an iframe. The host page needs no script:
     <iframe src="https://horula.jaybulb.com/embed?city=Tokyo" width="320" height="120" style="border:0"></iframe>
     ?city=Tokyo or ?zone=Asia/Tokyo, &face=digital to drop the dial
     ?to=2026-12-25T00:00&label=Christmas for a countdown
     &theme=light|dark to pin a theme (it follows the system otherwise), &bg=none for a see-through background -->
<style>
  :root { color-scheme: light dark; --bg: #fff; --face: #f5f5f5; --text: #1d1d1f; --text2: #6e6e73; --tick: #8e8e93; --accent: #0a5fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; --face: #1c1c1e; --text: #f5f5f7; --text2: #98989d; --tick: #636366; --accent: #3d9bff; } }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #000; --face: #1c1c1e; --text: #f5f5f7; --text2: #98989d; --tick: #636366; --accent: #3d9bff; }
  :root[data-theme="light"] { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; gap: 6vmin; padding: 0 6vmin; box-sizing: border-box; overflow: hidden;
    font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", Lato, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .bg-none body { background: transparent; }
  svg { flex: none; height: 82vmin; width: 82vmin; }
  .rim { fill: var(--face); } .tick { stroke: var(--tick); stroke-linecap: round; }
  .hand { stroke: var(--text); stroke-linecap: round; } .sec { stroke: var(--accent); stroke-linecap: round; } .hub { fill: var(--accent); }
  .text { min-width: 0; }
  .title { font-size: clamp(12px, 13vmin, 22px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .big { font-size: clamp(20px, 34vmin, 72px); font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big small { font-size: .42em; font-weight: 400; margin-inline-start: .12em; }
  .meta { font-size: clamp(11px, 10vmin, 17px); color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  a.by { position: fixed; inset-inline-end: 6px; bottom: 4px; font-size: 10px; color: var(--text2); text-decoration: none; opacity: .7; }
  a.by:hover { opacity: 1; }
  .count { flex-direction: column; gap: 1vmin; } .count .text { text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<svg id="dial" viewBox="-50 -50 100 100" aria-hidden="true">
  <circle class="rim" r="48"/><g id="ticks"></g>
  <line id="h" class="hand" y2="-24" stroke-width="4"/><line id="m" class="hand" y2="-36" stroke-width="3"/>
  <line id="s" class="sec" y1="7" y2="-40" stroke-width="1.2"/><circle class="hub" r="2.6"/>
</svg>
<div class="text" role="timer" aria-live="off">
  <div class="title" id="title"></div>
  <div class="big" id="big"></div>
  <div class="meta" id="meta"></div>
</div>
<a class="by" href="https://horula.jaybulb.com/" target="_blank" rel="noopener">Horula</a>
<script src="lib.js"></script>
<script>
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  if (['light', 'dark'].includes(q.get('theme'))) document.documentElement.dataset.theme = q.get('theme');
  if (q.get('bg') === 'none') document.documentElement.classList.add('bg-none');
  const to = q.get('to') && new Date(q.get('to')), place = findZone(q.get('zone') || q.get('city')) || { city: 'Local time', zone: undefined };
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  $('ticks').innerHTML = Array.from({ length: 12 }, (_, i) => `<line class="tick" y1="-44" y2="${i % 3 ? -40 : -37}" stroke-width="${i % 3 ? 1.5 : 2.5}" transform="rotate(${i * 30})"/>`).join('');
  const fmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', timeZone: place.zone });
  if (to && !isNaN(to)) {
    // Countdown: the label, whole days, then hours, minutes and seconds.
    $('dial').toggleAttribute('hidden', true);   // SVG has no .hidden property
    document.body.classList.add('count');
    $('title').textContent = (q.get('label') || '').slice(0, 60) || new Intl.DateTimeFormat(undefined, { dateStyle: 'medium' }).format(to);
    const tick = () => { const c = countdown(to - Date.now()); $('big').textContent = `${c.days} ${c.days === 1 ? 'day' : 'days'}`; $('meta').textContent = c.hms; };
    tick(); setInterval(tick, 1000);
  } else {
    $('dial').toggleAttribute('hidden', q.get('face') === 'digital');
    $('title').textContent = place.city;
    let last = -1;
    const tick = () => {
      const now = new Date(), a = place.zone ? handAngles(place.zone, now) : { h: (now.getHours() % 12 + now.getMinutes() / 60) * 30, m: now.getMinutes() * 6 };
      $('h').setAttribute('transform', `rotate(${a.h})`); $('m').setAttribute('transform', `rotate(${a.m + now.getSeconds() / 10})`);
      $('s').setAttribute('transform', `rotate(${(now.getSeconds() + (still.matches ? 0 : now.getMilliseconds() / 1000)) * 6})`);
      if (now.getSeconds() !== last) { last = now.getSeconds(); $('big').innerHTML = timeHTML(fmt, now); $('meta').textContent = place.zone ? offsetLabel(place.zone, now) : ''; }
      requestAnimationFrame(tick);
    };
    tick();
  }
</script>
</body>
</html>
