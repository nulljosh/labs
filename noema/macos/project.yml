name: Noema
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Noema:
    type: application
    platform: macOS
    sources:
      - path: Noema
      - path: ../discoveries.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.noema
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noema
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_ENTITLEMENTS: Noema/Noema.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  NoemaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Noema/Model.swift
      - path: Noema/Views.swift
      - path: Noema/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.noema.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Noema:
    build:
      targets:
        Noema: all
        NoemaTests: [test]
    test:
      targets: [NoemaTests]
