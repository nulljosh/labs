<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Registry rows and papers checked against themselves, flags read by hand, then the ledger"><rect width="760" height="260" fill="white"/><text x="10" y="38" font-family="sans-serif" font-size="13" fill="#6B7785">Registry</text><rect x="10" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="90" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">ClinicalTrials.gov</text><text x="90" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">API, 1 per second</text><path d="M170 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="200" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="280" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Baseline tables,</text><text x="280" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">outcome analyses</text><path d="M360 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="390" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="470" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Checks against</text><text x="470" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">themselves</text><path d="M550 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="580" y="50" width="170" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="665" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Flags, judged</text><text x="665" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">by the p-value</text><text x="10" y="148" font-family="sans-serif" font-size="13" fill="#6B7785">Papers</text><rect x="10" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="90" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">PubMed abstracts</text><text x="90" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">and PMC full text</text><path d="M170 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="200" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="280" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Printed numbers</text><text x="280" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">recomputed</text><path d="M360 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="390" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="470" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Every flag</text><text x="470" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">read by hand</text><path d="M550 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="580" y="160" width="170" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="665" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Ledger: clear</text><text x="665" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">mismatch or open</text></svg>
