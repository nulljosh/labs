<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" role="img" aria-label="Row-by-row exact counts on wrapped grids, checked against Beale and Onsager, then the triangle grid"><rect width="760" height="150" fill="white"/><text x="10" y="38" font-family="sans-serif" font-size="13" fill="#6B7785">Ising</text><rect x="10" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="90" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Count one row</text><text x="90" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">at a time</text><path d="M170 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="200" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="280" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Exact counts on</text><text x="280" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">wrapped grids</text><path d="M360 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="390" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="470" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Beale and</text><text x="470" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Onsager values</text><path d="M550 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="580" y="50" width="170" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="665" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Triangle grid</text><text x="665" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">cold states</text></svg>
