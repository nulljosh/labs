<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Busy Beaver tree to deciders to FAR certificates to Lean, and halters.c counting to cross-checks"><rect width="760" height="260" fill="white"/><text x="10" y="38" font-family="sans-serif" font-size="13" fill="#6B7785">Busy Beaver</text><rect x="10" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="90" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">busy.py grows</text><text x="90" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">only reached rules</text><path d="M170 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="200" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="280" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Deciders: cycles,</text><text x="280" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">shifts, n-grams</text><path d="M360 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="390" y="50" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="470" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">FAR certificates</text><text x="470" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">for the rest</text><path d="M550 85h30" stroke="#DDDDDD" stroke-width="2"/><rect x="580" y="50" width="170" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="665" y="81" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Lean 4 kernel</text><text x="665" y="100" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">checks each leaf</text><text x="10" y="148" font-family="sans-serif" font-size="13" fill="#6B7785">Counting halters</text><rect x="10" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="90" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">halters.c</text><text x="90" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">weighted tree walk</text><path d="M170 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="200" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="280" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Step cap set</text><text x="280" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">to the proved BB</text><path d="M360 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="390" y="160" width="160" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="470" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Long halters</text><text x="470" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">rerun alone</text><path d="M550 195h30" stroke="#DDDDDD" stroke-width="2"/><rect x="580" y="160" width="170" height="70" rx="12" fill="white" stroke="#DDDDDD"/><text x="665" y="191" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">Counts, step sums,</text><text x="665" y="210" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#001F3F">runtime spectrum</text></svg>
