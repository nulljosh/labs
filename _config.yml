title: Joshua's Journal
description: "Plain-English updates on the apps, AI and operating system I build, by Joshua Trommel."
url: "https://journal.heyitsmejosh.com"
author:
  name: "Joshua Trommel"
permalink: /:year/:month/:day/:slug/
markdown: kramdown
timezone: America/Vancouver
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

words_per_minute: 200

# Jekyll skips underscore-prefixed files by default, and Cloudflare Pages needs
# _headers at the site root to apply the security headers.
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - scripts
  - default.profraw
  - vendor
  - "*.profraw"
