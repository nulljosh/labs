name: Homeqi
options:
  bundleIdPrefix: com.heyitsmejosh
targets:
  Homeqi:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources: [Homeqi]
    info:
      path: Homeqi/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.homeqi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QMM486NPYC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        CODE_SIGN_ENTITLEMENTS: Homeqi.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Homeqi-macOS.entitlements
schemes:
  Homeqi:
    build:
      targets:
        Homeqi: all
    shared: true
