<rect width="170" height="44" x="35" y="195" fill="#f5f5f7" stroke="#d1d1d6" rx="8"/>
<text x="120" y="213" fill="#333" font-size="11" text-anchor="middle">localStorage</text>
<text x="120" y="228" fill="#333" font-size="11" text-anchor="middle">fengshui.assessment</text>

