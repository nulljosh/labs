<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" style="background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif" viewBox="0 0 640 400">
<text x="320" y="28" fill="#333" font-size="16" font-weight="600" text-anchor="middle">Homeqi Architecture</text>

