name = "authmail"
main = "src/index.js"
compatibility_date = "2025-08-01"
routes = [{ pattern = "authmail.heyitsmejosh.com", custom_domain = true }]

[observability]
enabled = true

# Public endpoints (/signup, /confirm). The Worker refuses them when any binding is missing or throws.
# Per client: 5 per 10 s, keyed on the IP (the /64 for IPv6), signup and confirm counted separately.
[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "1701"
simple = { limit = 5, period = 10 }

# Per recipient: one confirm mail and one enrol per address per minute, whatever IP asks.
[[ratelimits]]
name = "RECIPIENT_RATE_LIMITER"
namespace_id = "1702"
simple = { limit = 1, period = 60 }

# Whole public surface: 300 Resend-bound requests a minute per location, so it cannot starve the auth hook
# of Resend's 10 requests a second.
[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1703"
simple = { limit = 300, period = 60 }
