# Cloudflare Pages project for the Coranto landing page.
# The site is plain static HTML in web/ — there is no build step.
#
#   npx wrangler pages deploy        # reads pages_build_output_dir below
#
# Custom domain (coranto.jaybulb.com) is attached once, in the
# Cloudflare dashboard under Workers & Pages > coranto > Custom domains.
name = "inkpress"
pages_build_output_dir = "web"
compatibility_date = "2026-08-23"
