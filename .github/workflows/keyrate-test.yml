name: keyrate test
on:
  push:
    branches: [main]
    paths: ["keyrate/**", ".github/workflows/keyrate-test.yml"]
  pull_request:
    branches: [main]
    paths: ["keyrate/**", ".github/workflows/keyrate-test.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: keyrate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test

  # The Kotlin port against the same vectors.json (VectorsTest), on Linux. node --test above covers the JS.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew :shared:jvmTest --no-daemon
        working-directory: keyrate/kmp

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: README file references aren't stale
        run: |
          python3 - <<'PY'
          import re, os, sys
          refs = re.findall(r'(?:src="|\]\()([^")#?\s]+)', open("README.md").read())
          bad = [r for r in refs if "://" not in r and not r.startswith(("mailto:", "/")) and not os.path.exists(r)]
          print("stale README refs:", bad)
          sys.exit(bool(bad))
          PY
