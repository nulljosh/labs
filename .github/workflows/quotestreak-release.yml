name: quotestreak Release
on:
  push:
    tags: ['quotestreak-v*']
  workflow_dispatch:   # build-only dry run; release step needs a tag
defaults:
  run:
    working-directory: quotestreak

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: cd macos && xcodegen generate
      - name: Build
        run: |
          cd macos
          xcodebuild build -project Quotable.xcodeproj -scheme Quotable -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Zip app
        run: |
          cd macos/build/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/quotestreak/Quotestreak-macOS.zip" Quotestreak.app
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: quotestreak/Quotestreak-macOS.zip
          generate_release_notes: true
