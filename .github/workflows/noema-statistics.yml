name: noema statistics
on:
  push:
    branches: [main]
    paths: ["noema/statistics/**", ".github/workflows/noema-statistics.yml"]
  pull_request:
    branches: [main]
    paths: ["noema/statistics/**", ".github/workflows/noema-statistics.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noema/statistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
