name: evidna Tests
on:
  push:
    branches: [main]
    paths: ["evidna/**", ".github/workflows/evidna-test.yml"]
  pull_request:
    branches: [main]
    paths: ["evidna/**", ".github/workflows/evidna-test.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: evidna

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run evidna.py benchmark
      - run: uv run evidna.py export-demo && git diff --exit-code -- landing/results.json landing/study.json
