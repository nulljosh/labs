name: noema cs
on:
  push:
    branches: [main]
    paths: ["noema/cs/**", ".github/workflows/noema-cs.yml"]
  pull_request:
    branches: [main]
    paths: ["noema/cs/**", ".github/workflows/noema-cs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noema/cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: noema/cs/proofs
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
