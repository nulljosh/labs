name: Oohaah
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 155.0.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202610201200"
targets:
  Oohaah:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: ../Oohaah.icon
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.oohah
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Oohaah
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Oohaah.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Oohaah-macOS.entitlements
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
  OohaahTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Oohaah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.oohah.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Oohaah.app/Contents/MacOS/Oohaah
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Oohaah:
    build:
      targets:
        Oohaah: all
        OohaahTests: [test]
    test:
      targets:
        - OohaahTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
