<svg class="post-header-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect fill="none" class="bg" width="800" height="500"/>
  <rect class="brd" x="20" y="20" width="760" height="460" rx="12" ry="12" fill="none" stroke="currentColor" stroke-width="1" opacity="0.25"/>

  <text fill="currentColor" x="48" y="90" font-size="42" font-weight="300" letter-spacing="-1">Releases</text>
  <text fill="currentColor" x="48" y="126" font-size="16" opacity="0.6">voxprint ships on mac . uprighty becomes bookrank . newsline becomes a dependency</text>

  <line stroke="currentColor" x1="48" y1="152" x2="752" y2="152" stroke-width="1" opacity="0.25"/>

  <text fill="currentColor" x="48" y="188" font-size="14">voxprint, bookrank, inkpress, healstack</text>
  <text fill="currentColor" x="48" y="210" font-size="14">newsline, epiphany, lexly, litigate</text>
  <text fill="currentColor" x="48" y="236" font-size="14" opacity="0.6">(rename propagated across repo, domain and store)</text>

  <text fill="currentColor" x="48" y="286" font-size="14">mac approved before the phone build</text>
  <text fill="currentColor" x="48" y="308" font-size="14">five book names taken before bookrank cleared</text>
  <text fill="currentColor" x="48" y="330" font-size="14">storage bucket rebuilt to be private</text>
  <text fill="currentColor" x="48" y="352" font-size="14">feed parser only knew one of two formats</text>
  <text fill="currentColor" x="48" y="374" font-size="14">rejection reasons finally read, not guessed</text>

  <rect class="brd" x="560" y="176" width="200" height="280" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="1" opacity="0.25"/>
  <text fill="currentColor" x="584" y="206" font-size="12" opacity="0.6">shipped</text>
  <text fill="currentColor" x="584" y="238" font-size="28" font-weight="500">1</text>
  <text fill="currentColor" x="584" y="272" font-size="12" opacity="0.6">in flight</text>
  <text fill="currentColor" x="584" y="296" font-size="14">bookrank ios</text>
  <text fill="currentColor" x="584" y="318" font-size="14">inkpress 1.0.3</text>
  <text fill="currentColor" x="584" y="340" font-size="14">newsline api</text>
  <text fill="currentColor" x="584" y="430" font-size="12" opacity="0.6">window</text>
  <text fill="currentColor" x="584" y="452" font-size="13">Aug 6 -- Aug 10</text>

  <text fill="currentColor" x="48" y="462" font-size="13" opacity="0.6">2026-08-06</text>
</svg>
