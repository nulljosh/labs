<svg class="post-header-svg" width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <rect stroke="currentColor" fill="none" class="svg-bg" width="1200" height="200"/>
  <g class="svg-text">
    <!-- Puzzle pieces representing consolidation -->
    <rect x="100" y="50" width="120" height="120" rx="8" class="svg-border" stroke-width="2" fill="none"/>
    <rect x="240" y="50" width="120" height="120" rx="8" class="svg-border" stroke-width="2" fill="none"/>
    <rect x="380" y="50" width="120" height="120" rx="8" class="svg-border" stroke-width="2" fill="none"/>
    <circle cx="160" cy="110" r="6" fill="currentColor"/>
    <circle cx="300" cy="110" r="6" fill="currentColor"/>
    <circle cx="440" cy="110" r="6" fill="currentColor"/>
    <!-- Arrow pointing right symbolizing consolidation flow -->
    <line stroke="currentColor" fill="none" x1="520" y1="110" x2="600" y2="110" class="svg-border" stroke-width="3" stroke-linecap="round"/>
    <polygon points="610,110 590,100 590,120" fill="currentColor"/>
    <!-- Single consolidated box -->
    <rect x="650" y="50" width="120" height="120" rx="8" fill="none" class="svg-border" stroke-width="3"/>
    <circle cx="710" cy="110" r="6" fill="currentColor"/>
  </g>
</svg>
