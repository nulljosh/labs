<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        text { fill: #e0e0e0; }
        circle { fill: none; stroke: #444; stroke-width: 2; }
      }
      @media (prefers-color-scheme: light) {
        text { fill: #1a1a1a; }
        circle { fill: none; stroke: #d0d0d0; stroke-width: 2; }
      }
    </style>
  </defs>
  <text x="400" y="100" font-size="72" font-weight="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-2">Silent</text>
  <circle cx="400" cy="140" r="30" opacity="0.3"/>
</svg>
