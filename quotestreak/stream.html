<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotestreak Stream</title>
<meta name="description" content="Put Quotestreak on your stream and let Twitch chat vote on every line.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  const mq = matchMedia('(prefers-color-scheme: light)');
  document.documentElement.dataset.theme = mq.matches ? 'light' : 'dark';
  mq.addEventListener('change', e => document.documentElement.dataset.theme = e.matches ? 'light' : 'dark');
</script>
<style>
  .stream { width: 100%; max-width: 1400px; padding: 4vh 5vw; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  #stream-setup { max-width: 480px; margin: 0 auto; text-align: center; }
  #stream-setup input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.2rem; padding: 14px 16px; margin: 0 0 12px; border: 0; border-radius: 12px; background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  #stream-top { font-size: clamp(1rem, 2vw, 1.8rem); font-weight: 600; color: var(--muted); }
  #stream-prompt { font-size: clamp(1rem, 1.8vw, 1.6rem); color: var(--muted); margin: 3vh 0 1vh; }
  #stream-quote { font-size: clamp(1.6rem, 3.4vw, 3.4rem); font-weight: 600; line-height: 1.3; margin: 0 0 4vh; }
  #stream-options { display: grid; gap: 1.6vh; }
  #stream-options div { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1.6vw; padding: 2vh 2vw; border-radius: 16px; background: var(--panel); font-size: clamp(1.1rem, 2.2vw, 2.2rem); font-weight: 600; }
  #stream-options i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: 0.35; transition: width 0.3s; }
  #stream-options div.right { background: var(--good); color: #fff; }
  #stream-options .key { position: relative; z-index: 1; font-size: 0.7em; color: var(--muted); width: 1.4em; }
  #stream-options div.right .key { color: #fff; }
  #stream-options .name { position: relative; z-index: 1; flex: 1; }
  #stream-options .pct { position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  #stream-votes { margin-top: 2vh; color: var(--muted); font-size: clamp(0.9rem, 1.4vw, 1.3rem); }
</style>
</head>
<body>
  <main class="stream">
    <form id="stream-setup">
      <h1>Stream mode</h1>
      <p class="prompt">Chat votes on every line. Type your Twitch channel, then add this page to your stream as a browser source.</p>
      <input id="stream-channel" placeholder="Your channel name" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Twitch channel">
      <button>Start</button>
    </form>
    <section id="stream-game" class="hidden">
      <div id="stream-top"></div>
      <p id="stream-prompt"></p>
      <p id="stream-quote"></p>
      <div id="stream-options"></div>
      <p id="stream-votes"></p>
      <p id="stream-status" class="prompt"></p>
    </section>
  </main>
  <script src="stream.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
