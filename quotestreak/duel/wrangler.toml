# Live duels (v12): one Durable Object per room code relays two players' answers.
# Routed on the game's own host so the page connects same-origin.
name = "quotestreak-duel"
main = "worker.js"
compatibility_date = "2025-07-01"
workers_dev = false
routes = [{ pattern = "coda.jaybulb.com/duel/*", zone_name = "jaybulb.com" }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "PARTIES"
class_name = "Party"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Party"]
