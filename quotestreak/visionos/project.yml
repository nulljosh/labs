name: QuotableVision
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    visionOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, fr, zh, pa, Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuotableVision:
    type: application
    platform: visionOS
    sources:
      # Shared with iOS — Game/Quote/Theme are platform-agnostic and ContentView
      # branches on #if os(macOS). Do not fork these files.
      - path: ../ios/Quotable/Game.swift
      - path: ../ios/Quotable/SharedStore.swift
      - path: ../ios/Quotable/Quote.swift
      - path: ../ios/Quotable/Theme.swift
      - path: ../ios/Quotable/ContentView.swift
      - path: ../ios/Quotable/Sound.swift
      - path: ../ios/Quotable/Account.swift
      - path: ../ios/Quotable/AccountViews.swift
      - path: ../ios/Quotable/Duel.swift
      - path: ../ios/Quotable/DuelViews.swift
      - path: ../ios/Quotable/Daily.swift
      - path: ../ios/Quotable/Intents.swift
      - path: ../ios/Quotable/Localizable.xcstrings
        buildPhase: resources
      - path: Quotable
      - path: ../ios/Quotable/Resources
        buildPhase: resources
      - path: ../Coda.icon
      - path: ../brand/Quip.xcassets
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes: ["*.ttf", "OFL.txt"]
    info:
      path: Quotable/Info.plist
      properties:
        CFBundleDisplayName: Coda
        LSApplicationCategoryType: public.app-category.trivia-games
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [com.heyitsmejosh.quotable.game]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    settings:
      base:
        PRODUCT_NAME: Coda
        # Same bundle id as iOS: Vision Pro joins the universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable
        ASSETCATALOG_COMPILER_APPICON_NAME: Coda
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ../ios/Quotable.entitlements
schemes:
  QuotableVision:
    build:
      targets:
        QuotableVision: all
    archive:
      config: Release
    shared: true
