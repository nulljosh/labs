<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coda Buzzer</title>
<meta name="description" content="Your phone is the buzzer for a Coda game on the big screen.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  const mq = matchMedia('(prefers-color-scheme: light)');
  document.documentElement.dataset.theme = mq.matches ? 'light' : 'dark';
  mq.addEventListener('change', e => document.documentElement.dataset.theme = e.matches ? 'light' : 'dark');
</script>
<style>
  #buzz-options { display: grid; gap: 12px; }
  #buzz-options button { font-size: 1.2rem; padding: 22px; text-align: left; background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  #buzz-options button.picked { box-shadow: inset 0 0 0 3px var(--accent-deep); }
  #buzz-options button.correct { background: var(--good); color: #fff; box-shadow: none; }
  #buzz-options button.wrong { background: var(--bad); color: #fff; box-shadow: none; }
  #buzz-join input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.2rem; padding: 14px 16px; margin: 0 0 12px; border: 0; border-radius: 12px; background: var(--bg); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  #buzz-code { text-transform: uppercase; letter-spacing: 0.3em; text-align: center; }
  #buzz-board { text-align: left; max-width: 320px; margin: 8px auto; }
</style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/" aria-label="Coda home"><img src="icon.svg" alt="" class="logo"><span class="wordmark">Coda</span></a>
    <div class="stats"><span id="buzz-me"></span></div>
  </nav>
  <main class="wrap">
    <h1 class="sr-only">Coda buzzer</h1>
    <div class="panel">
      <form id="buzz-join">
        <h2>Join the game</h2>
        <p class="prompt">Type the code on the TV.</p>
        <input id="buzz-code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="Room code">
        <input id="buzz-name" maxlength="20" autocomplete="nickname" placeholder="Your name" aria-label="Your name">
        <button>Join</button>
      </form>
      <div id="buzz-play" class="hidden">
        <p id="buzz-status" class="prompt"></p>
        <div id="buzz-options"></div>
        <ol id="buzz-board"></ol>
      </div>
    </div>
  </main>
  <script src="buzz.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
