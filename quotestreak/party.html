<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotestreak Party</title>
<meta name="description" content="Put Quotestreak on a big screen; everyone plays on their phone.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
  const mq = matchMedia('(prefers-color-scheme: light)');
  document.documentElement.dataset.theme = mq.matches ? 'light' : 'dark';
  mq.addEventListener('change', e => document.documentElement.dataset.theme = e.matches ? 'light' : 'dark');
</script>
<style>
  /* A room-sized screen: type scales with the window so it reads from across the room. */
  .party { width: 100%; max-width: 1400px; padding: 4vh 5vw; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .party h1 { font-size: clamp(2rem, 5vw, 5rem); margin: 0 0 1vh; }
  .party .prompt { font-size: clamp(1rem, 2vw, 2rem); margin: 0 0 2vh; }
  #party-code { font-size: clamp(4rem, 14vw, 13rem); font-weight: 700; letter-spacing: 0.2em; color: var(--accent-deep); line-height: 1; margin: 2vh 0; }
  #party-quote { font-size: clamp(1.6rem, 3.6vw, 3.6rem); font-weight: 600; line-height: 1.3; margin: 2vh 0 4vh; }
  #party-options { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh 2vw; }
  #party-options div { font-size: clamp(1.1rem, 2.2vw, 2.2rem); font-weight: 600; padding: 3vh 2vw; border-radius: 20px; background: var(--panel); }
  #party-options div.right { background: var(--good); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 3vh 0; }
  .chip { font-size: clamp(1rem, 1.8vw, 1.8rem); font-weight: 600; padding: 10px 20px; border-radius: 999px; background: var(--panel); }
  .chip.in { box-shadow: inset 0 0 0 3px var(--accent-deep); }
  .chip.up { background: var(--good); color: #fff; }
  .party-top { display: flex; justify-content: space-between; font-size: clamp(1rem, 2vw, 2rem); font-weight: 600; color: var(--muted); }
  #party-final { font-size: clamp(1.4rem, 3vw, 3rem); list-style-position: inside; padding: 0; }
  .party button { font-size: clamp(1rem, 1.8vw, 1.8rem); padding: 16px 32px; }
</style>
</head>
<body>
  <main class="party">
    <section id="party-lobby">
      <h1>Grab your phones</h1>
      <p class="prompt">Open <b id="party-url"></b> and type this code.</p>
      <div id="party-code"></div>
      <div id="party-players" class="chips"></div>
      <p id="party-status" class="prompt"></p>
      <button id="party-start">Waiting for players</button>
    </section>
    <section id="party-round" class="hidden">
      <div class="party-top"><span id="party-n"></span><span id="party-clock"></span></div>
      <p id="party-quote"></p>
      <div id="party-options"></div>
      <div id="party-who" class="chips"></div>
      <button id="party-next">Show the answer</button>
    </section>
    <section id="party-over" class="hidden">
      <h1 id="party-winner"></h1>
      <ol id="party-final"></ol>
      <button id="party-again">Play again</button>
    </section>
  </main>
  <script src="party.js"></script>
</body>
</html>
