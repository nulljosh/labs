name: QuotableTV
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuotableTV:
    type: application
    platform: tvOS
    sources:
      - path: Quotable
      - path: ../ios/Quotable/Quote.swift
      - path: ../ios/Quotable/Theme.swift
      - path: ../quotes.json
        buildPhase: resources
      - path: ../fonts
        buildPhase: resources
        includes: ["*.ttf"]
    info:
      path: Quotable/Info.plist
      properties:
        CFBundleDisplayName: Coda
        UILaunchScreen: {}
        LSApplicationCategoryType: public.app-category.trivia-games
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Coda
        # Same bundle id as iOS: Apple TV joins the universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.quotable
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
schemes:
  QuotableTV:
    build:
      targets:
        QuotableTV: all
    archive:
      config: Release
    shared: true
