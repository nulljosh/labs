<g font-size="11" fill="#666"><path stroke="#d1d1d6" d="M30 630H62"/><text x="70" y="634">opens a page or shows inline</text><path stroke="#d1d1d6" stroke-dasharray="5 4" d="M260 630H292"/><text x="300" y="634">opens a sheet, alert or dialog</text><text x="30" y="662">Same screens on Mac and iPhone. Signing in is optional; without it everything stays on the device. Screenshots: docs/SCREENS.md</text></g></svg>