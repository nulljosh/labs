name: BCGD
options:
  bundleIdPrefix: com.joshuatrommel
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: QMM486NPYC
targets:
  BCGD:
    type: application
    platform: macOS
    entitlements:
      path: BCGD.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    sources:
      - Sources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuatrommel.bcgd
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 202608271310
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doorstock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        ENABLE_HARDENED_RUNTIME: YES
