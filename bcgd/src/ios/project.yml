name: BCGD
options:
  bundleIdPrefix: com.joshuatrommel
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
targets:
  BCGD:
    type: application
    platform: iOS
    sources: [BCGD]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuatrommel.bcgd
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BCGD.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 202608271310
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doorstock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock Doorstock with Face ID
