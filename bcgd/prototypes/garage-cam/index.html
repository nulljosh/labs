<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doorstock Garage Cam</title>
<!-- Prototype: a phone or old iPad propped on the shelf watches the bins. Draw a box around each bin,
     tie it to a part. When someone walks off and a bin looks different, it asks "taken or added?".
     ponytail: frame differencing on a 64px grid, no ML. Real part recognition comes after we see real footage. -->
<style>
:root { --accent:#1b4fc4; --page:#f2f2f7; --card:#fff; --ink:#111; --dim:#6e6e73; --red:#d70015; color-scheme:light dark; }
@media (prefers-color-scheme: dark) { :root { --accent:#3a86ff; --page:#000; --card:#1c1c1e; --ink:#f5f5f7; --dim:#98989d; --red:#ff453a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:16px/1.4 -apple-system, system-ui, sans-serif; }
main { max-width:720px; margin:0 auto; padding:16px; display:grid; gap:16px; }
h1 { font-size:28px; margin:8px 0 0; }
.sub { color:var(--dim); margin:0; }
.cam { position:relative; border-radius:28px; overflow:hidden; background:#000; aspect-ratio:4/3; touch-action:none; }
video, canvas.overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.live { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.55); color:#fff; font-size:13px; font-weight:600; padding:4px 10px; border-radius:99px; display:flex; gap:6px; align-items:center; }
.dot { width:8px; height:8px; border-radius:50%; background:#30d158; }
.live.moving .dot { background:#ff9f0a; }
.empty { position:absolute; inset:0; display:grid; place-items:center; color:#fff; text-align:center; padding:24px; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
button { font:inherit; font-weight:600; border:0; border-radius:99px; min-height:48px; padding:0 20px; background:var(--accent); color:#fff; cursor:pointer; }
button.soft { background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent); }
button.red { background:color-mix(in srgb, var(--red) 14%, transparent); color:var(--red); }
.card { background:var(--card); border-radius:28px; padding:16px; }
.card h2 { font-size:17px; margin:0 0 8px; }
ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
li { display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; }
li small { color:var(--dim); display:block; }
.none { color:var(--dim); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Garage Cam</h1>
    <p class="sub">Prop a phone on the shelf. Box each bin. It asks when one changes.</p>
  </div>
  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <canvas class="overlay" id="overlay"></canvas>
    <div class="live" id="live" hidden><span class="dot"></span><span id="liveText">Watching</span></div>
    <div class="empty" id="empty"><button id="start">Turn on camera</button></div>
  </div>
  <div class="row">
    <button class="soft" id="draw" disabled>Box a bin</button>
    <button class="soft" id="reset" disabled>Shelf looks right now</button>
  </div>
  <section class="card"><h2>Asks</h2><ul id="asks"><li class="none">Nothing yet. Walk in, take something, walk out.</li></ul></section>
  <section class="card"><h2>Bins</h2><ul id="bins"><li class="none">No bins. Tap Box a bin, then drag over one.</li></ul></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
const W = 64, H = 48;                       // analysis grid
const grab = new OffscreenCanvas(W, H).getContext("2d", { willReadFrequently: true });
let bins = [], baseline = null, last = null, still = 0, moving = false, drawing = false, drag = null;
// Calibration knobs: tune on real footage.
const MOTION = 12, STILL_FRAMES = 15, BIN_CHANGE = 22;

function frame() { grab.drawImage(video, 0, 0, W, H); const d = grab.getImageData(0, 0, W, H).data, g = new Uint8Array(W * H); for (let i = 0; i < g.length; i++) g[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3; return g; }
function diff(a, b, r) { // mean abs difference inside r (0..1 coords), whole frame if no r
  const [x0, y0, x1, y1] = r ? [r.x*W, r.y*H, (r.x+r.w)*W, (r.y+r.h)*H].map(Math.round) : [0, 0, W, H];
  let s = 0, n = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { s += Math.abs(a[y*W+x] - b[y*W+x]); n++; }
  return n ? s / n : 0;
}

function tick() {
  if (video.readyState >= 2) {
    const now = frame();
    if (last) {
      const m = diff(now, last);
      if (m > MOTION) { moving = true; still = 0; }
      else if (moving && ++still > STILL_FRAMES) { moving = false; settle(now); }
    }
    if (!baseline) baseline = now;
    last = now;
    $("live").classList.toggle("moving", moving);
    $("liveText").textContent = moving ? "Someone's here" : "Watching";
  }
  paint();
  requestAnimationFrame(tick);
}

// Scene went quiet after movement: any bin that no longer matches the baseline gets an ask.
function settle(now) {
  for (const b of bins) { const d = diff(now, baseline, b); if (d > BIN_CHANGE) ask(b, d); }
  baseline = now;
}

function ask(bin, d) {
  const list = $("asks"); list.querySelector(".none")?.remove();
  const li = document.createElement("li");
  li.innerHTML = `<span><b></b><small>${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · bin looks different</small></span>
    <span class="row"><button class="red">Took 1</button><button class="soft">Added 1</button><button class="soft">Ignore</button></span>`;
  li.querySelector("b").textContent = bin.name;
  const [took, added, ignore] = li.querySelectorAll("button");
  // Prototype stops here: in the app these call Store.adjust(part, by: ∓1, reason: "Garage cam").
  took.onclick = () => { bin.count--; done(li, `${bin.name}: took 1`); };
  added.onclick = () => { bin.count++; done(li, `${bin.name}: added 1`); };
  ignore.onclick = () => li.remove();
  list.prepend(li);
}
function done(li, text) { li.innerHTML = ""; li.append(Object.assign(document.createElement("span"), { textContent: text })); renderBins(); }

function renderBins() {
  const ul = $("bins"); ul.innerHTML = "";
  if (!bins.length) { ul.innerHTML = '<li class="none">No bins. Tap Box a bin, then drag over one.</li>'; return; }
  for (const b of bins) {
    const li = document.createElement("li");
    li.innerHTML = `<span><b></b><small>${b.count >= 0 ? "+" : ""}${b.count} since you started</small></span><button class="soft">Remove</button>`;
    li.querySelector("b").textContent = b.name;
    li.querySelector("button").onclick = () => { bins = bins.filter((x) => x !== b); renderBins(); };
    ul.append(li);
  }
}

function paint() {
  const r = overlay.getBoundingClientRect();
  if (overlay.width !== r.width * devicePixelRatio) { overlay.width = r.width * devicePixelRatio; overlay.height = r.height * devicePixelRatio; }
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent");
  for (const b of [...bins, ...(drag ? [drag] : [])]) {
    ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.setLineDash(b === drag ? [8, 6] : []);
    ctx.strokeRect(b.x * r.width, b.y * r.height, b.w * r.width, b.h * r.height);
    if (b.name) {
      ctx.font = "600 13px -apple-system, system-ui"; const tw = ctx.measureText(b.name).width;
      const ty = Math.max(22, b.y * r.height);   // keep the tag on screen for a bin at the top edge
      ctx.fillStyle = accent; ctx.fillRect(b.x * r.width, ty - 22, tw + 16, 22);
      ctx.fillStyle = "#fff"; ctx.fillText(b.name, b.x * r.width + 8, ty - 7);
    }
  }
}

// Drag a box over a bin.
const pt = (e) => { const r = overlay.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };
$("cam").addEventListener("pointerdown", (e) => { if (!drawing) return; const p = pt(e); drag = { x: p.x, y: p.y, w: 0, h: 0, ox: p.x, oy: p.y }; $("cam").setPointerCapture(e.pointerId); });
$("cam").addEventListener("pointermove", (e) => { if (!drag) return; const p = pt(e); Object.assign(drag, { x: Math.min(p.x, drag.ox), y: Math.min(p.y, drag.oy), w: Math.abs(p.x - drag.ox), h: Math.abs(p.y - drag.oy) }); });
$("cam").addEventListener("pointerup", () => {
  if (!drag) return;
  const b = drag; drag = null; drawing = false; $("draw").textContent = "Box a bin";
  if (b.w < 0.04 || b.h < 0.04) return;
  const name = prompt("Which part lives in this bin?", "Torsion Spring .225 x 2\" x 24\" LH");
  if (!name?.trim()) return;
  bins.push({ x: b.x, y: b.y, w: b.w, h: b.h, name: name.trim().slice(0, 60), count: 0 });
  renderBins();
});

$("draw").onclick = () => { drawing = !drawing; $("draw").textContent = drawing ? "Drag over a bin" : "Box a bin"; };
$("reset").onclick = () => { baseline = last; };
$("start").onclick = async () => {
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    await video.play();
    $("empty").remove(); $("live").hidden = false; $("draw").disabled = $("reset").disabled = false;
    requestAnimationFrame(tick);
  } catch { $("empty").textContent = "No camera. Allow camera access and reload."; }
};
</script>
</body>
</html>
