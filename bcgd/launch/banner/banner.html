<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doorstock banner</title>
<!-- Animated Doorstock banner. Deterministic: seek(t) draws the frame at t seconds.
     render.swift loads this at ?w=…&h=… and snapshots every frame; open it in a browser to preview (it plays itself). -->
<style>
  :root { --accent: #1b4fc4; --accent-light: #3a86ff; --ink: #1d1d1f; --muted: #5b6270; --bg: #ffffff; --bg2: #eef2f8; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 80% at 85% 10%, #dfe8fb 0%, rgba(223,232,251,0) 55%), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); }
  .blob { position: absolute; border-radius: 50%; }
  .layer { position: absolute; inset: 0; will-change: transform, opacity; }
  .icon { position: absolute; border-radius: 22.37%; box-shadow: 0 calc(var(--u)*2) calc(var(--u)*6) rgba(27,79,196,.28); }
  .title { position: absolute; font-weight: 700; letter-spacing: -0.02em; line-height: 1.02; }
  .sub { position: absolute; color: var(--muted); font-weight: 500; line-height: 1.25; }
  .kicker { position: absolute; color: var(--accent); font-weight: 650; letter-spacing: .02em; text-transform: uppercase; }
  .phone { position: absolute; border-radius: 13% / 6%; background: #111; padding: 2.2%;
    box-shadow: 0 calc(var(--u)*3) calc(var(--u)*10) rgba(20,30,60,.22), 0 0 0 calc(var(--u)*.25) #2a2a2e inset; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 11% / 5.2%; overflow: hidden; background: #f2f2f7; }
  .screen img { position: absolute; top: 0; height: 100%; width: 100%; object-fit: cover; }
  .cap { position: absolute; }
  .tap { position: absolute; border-radius: 50%; border: calc(var(--u)*.5) solid var(--accent-light); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="background:radial-gradient(closest-side, rgba(58,134,255,.30), rgba(58,134,255,0))"></div>
  <div class="blob" id="b2" style="background:radial-gradient(closest-side, rgba(27,79,196,.16), rgba(27,79,196,0))"></div>

  <div class="layer" id="intro">
    <img class="icon" id="iIcon" src="img/icon.png" alt="">
    <div class="title" id="iTitle">Doorstock</div>
    <div class="sub" id="iSub">Stock and jobs for garage door shops</div>
  </div>

  <div class="layer" id="caps"></div>

  <div class="phone" id="phone"><div class="screen" id="screen">
    <img src="img/02-inventory.png" alt="">
    <img src="img/03-jobs.png" alt="">
    <img src="img/01-dashboard.png" alt="">
  </div></div>
  <div class="tap" id="tap"></div>

  <div class="layer" id="outro">
    <img class="icon" id="oIcon" src="img/icon.png" alt="">
    <div class="title" id="oTitle">Doorstock</div>
    <div class="sub" id="oSub">Know what's on the shelf.</div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const W = +q.get("w") || innerWidth, H = +q.get("h") || innerHeight;
const wide = W / H > 1.2;
const u = Math.min(W, H) / 100;                       // 1u = 1% of the short side
document.documentElement.style.setProperty("--u", u + "px");
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";

// Timeline, seconds. Three screens, each with a caption; intro and outro cards.
const SCENES = [
  { k: "Inventory", t: "Every part, counted.", s: "Springs, cables, rollers and openers, each with a cost." },
  { k: "Jobs", t: "Finish a job. The parts come off the shelf.", s: "Your whole crew sees the same list." },
  { k: "Dashboard", t: "Low stock shows up first.", s: "One tap sends the reorder email." },
];
const INTRO = 3.2, SCENE = 4.6, OUTRO = 3.4;
const DURATION = INTRO + SCENES.length * SCENE + OUTRO;
window.DURATION = DURATION;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = (id) => document.getElementById(id);
const px = (n) => n + "px";
function box(el, x, y, w, h) { const s = el.style; s.left = px(x); s.top = px(y); if (w != null) s.width = px(w); if (h != null) s.height = px(h); }

// Phone geometry: tall in portrait, to the right in wide.
const phoneH = wide ? H * 0.86 : H * 0.62;
const phoneW = phoneH * (1242 / 2688) / 0.956;        // screen ratio plus bezel padding
const phoneX = wide ? W * 0.62 - phoneW / 2 + W * 0.06 : (W - phoneW) / 2;
const phoneY = wide ? (H - phoneH) / 2 : H * 0.30;
box($("phone"), phoneX, phoneY, phoneW, phoneH);

// Captions
const capX = wide ? W * 0.07 : W * 0.08, capW = wide ? W * 0.42 : W * 0.84;
const fs = wide ? { k: u * 2.6, t: u * 7.2, s: u * 3.2 } : { k: u * 3.6, t: u * 8.6, s: u * 4.2 };
SCENES.forEach((sc, i) => {
  const c = document.createElement("div"); c.className = "cap"; c.id = "cap" + i;
  c.innerHTML = `<div class="kicker" style="position:static;font-size:${fs.k}px;margin-bottom:${u * 1.4}px">${sc.k}</div>
    <div class="title" style="position:static;font-size:${fs.t}px">${sc.t}</div>
    <div class="sub" style="position:static;font-size:${fs.s}px;margin-top:${u * 2}px">${sc.s}</div>`;
  c.style.width = px(capW); c.style.left = px(capX);
  $("caps").appendChild(c);
});

function card(prefix, iconSize, titleSize, subSize) {
  const icon = $(prefix + "Icon"), title = $(prefix + "Title"), sub = $(prefix + "Sub");
  title.style.fontSize = px(titleSize); sub.style.fontSize = px(subSize);
  title.style.width = sub.style.width = px(W); title.style.textAlign = sub.style.textAlign = "center";
  const total = iconSize + u * 4 + titleSize * 1.05 + u * 1.6 + subSize * 1.3;
  const y0 = (H - total) / 2;
  box(icon, (W - iconSize) / 2, y0, iconSize, iconSize);
  box(title, 0, y0 + iconSize + u * 4);
  box(sub, 0, y0 + iconSize + u * 4 + titleSize * 1.05 + u * 1.6);
  return { icon, title, sub };
}
const intro = card("i", u * (wide ? 26 : 30), u * (wide ? 11 : 13), u * (wide ? 3.6 : 4.4));
const outro = card("o", u * (wide ? 22 : 26), u * (wide ? 10 : 12), u * (wide ? 3.6 : 4.4));

function seek(t) {
  // Background drift
  box($("b1"), W * (0.72 + 0.05 * Math.sin(t * 0.35)), H * (-0.12 + 0.04 * Math.cos(t * 0.3)), u * 70, u * 70);
  box($("b2"), W * (-0.15 + 0.04 * Math.cos(t * 0.28)), H * (0.72 + 0.04 * Math.sin(t * 0.4)), u * 60, u * 60);

  // Intro: icon pops, title and line rise in, then all lift away.
  const iIn = (d, a) => out(span(t, d, d + 0.7)) * a;
  const iOut = ease(span(t, INTRO - 0.6, INTRO + 0.1));
  const pop = out(span(t, 0.1, 0.9));
  intro.icon.style.transform = `scale(${0.6 + 0.4 * pop}) translateY(${-iOut * u * 12}px)`;
  intro.icon.style.opacity = pop * (1 - iOut);
  [[intro.title, 0.45], [intro.sub, 0.75]].forEach(([el, d]) => {
    const k = iIn(d, 1);
    el.style.opacity = k * (1 - iOut);
    el.style.transform = `translateY(${(1 - k) * u * 4 - iOut * u * 12}px)`;
  });

  // Phone: rises in after the intro, slides screens, then drops for the outro.
  const s0 = INTRO, end = INTRO + SCENES.length * SCENE;
  const pin = ease(span(t, s0 - 0.5, s0 + 0.5)), pout = ease(span(t, end - 0.4, end + 0.4));
  const ph = $("phone");
  ph.style.opacity = pin * (1 - pout);
  ph.style.transform = `translateY(${(1 - pin) * H * 0.25 + pout * H * 0.2}px) rotate(${(1 - pin) * (wide ? 4 : 2)}deg) scale(${0.96 + 0.04 * pin})`;

  // Screens slide sideways between scenes; each gets a slow push in.
  const imgs = $("screen").querySelectorAll("img");
  imgs.forEach((img, i) => {
    const a = s0 + i * SCENE;
    const enter = i === 0 ? 1 : ease(span(t, a - 0.35, a + 0.35));
    const leave = i === imgs.length - 1 ? 0 : ease(span(t, a + SCENE - 0.35, a + SCENE + 0.35));
    const push = 1 + 0.035 * span(t, a, a + SCENE);
    img.style.transform = `translateX(${(1 - enter) * 100 - leave * 100}%) scale(${push})`;
  });

  // Captions: fade and rise per scene.
  SCENES.forEach((_, i) => {
    const c = $("cap" + i), a = s0 + i * SCENE;
    const kin = out(span(t, a + 0.1, a + 0.8)), kout = ease(span(t, a + SCENE - 0.5, a + SCENE));
    c.style.opacity = kin * (1 - kout);
    const h = c.offsetHeight;
    const y = wide ? (H - h) / 2 : H * 0.07 + (H * 0.21 - h) / 2;
    c.style.top = px(y);
    c.style.transform = `translateY(${(1 - kin) * u * 4 - kout * u * 3}px)`;
  });

  // A tap ring on the stepper (inventory) and on Complete (jobs), placed on the screenshot.
  const tap = $("tap"), sw = phoneW * 0.956, sh = phoneH * 0.956, sx = phoneX + phoneW * 0.022, sy = phoneY + phoneH * 0.022;
  const taps = [[s0 + 1.8, 0.845, 0.306], [s0 + SCENE + 1.9, 0.785, 0.384]];
  let shown = false;
  for (const [at, fx, fy] of taps) {
    const k = span(t, at, at + 0.7);
    if (k > 0 && k < 1) {
      const r = u * (wide ? 5 : 6) * (0.4 + 0.8 * out(k));
      box(tap, sx + sw * fx - r / 2, sy + sh * fy - r / 2, r, r);
      tap.style.opacity = 0.9 * (1 - k); shown = true;
    }
  }
  if (!shown) tap.style.opacity = 0;

  // Outro
  const o = span(t, end + 0.1, end + 1.0);
  const ok = out(o);
  outro.icon.style.opacity = ok; outro.icon.style.transform = `scale(${0.7 + 0.3 * ok})`;
  [[outro.title, 0.25], [outro.sub, 0.5]].forEach(([el, d]) => {
    const k = out(span(t, end + d, end + d + 0.8));
    el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * u * 4}px)`;
  });
}
window.seek = seek;

// Preview in a browser: play in a loop. The renderer passes ?still=1 and drives seek() itself.
if (!q.get("still")) {
  const t0 = performance.now();
  const tick = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(tick);
} else seek(0);
</script>
</body>
</html>
